services:
  - type: web
    name: bizreplyai-api
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false --ignore-scripts && pnpm exec prisma generate && pnpm run build
    preDeployCommand: pnpm exec prisma migrate deploy
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_ENVIRONMENT
        value: production
      - key: KNOWLEDGE_STORAGE_PROVIDER
        value: s3
      - key: AWS_S3_BUCKET_ENVIRONMENT
        value: production
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: KNOWLEDGE_MALWARE_SCANNER_MODE
        value: clamav
      - key: KNOWLEDGE_CLAMAV_HOST
        sync: false
      - key: KNOWLEDGE_CLAMAV_PORT
        value: "3310"
      - key: DATABASE_URL
        fromDatabase:
          name: bizreplyai-db
          property: connectionString
      # Use the non-pooler PostgreSQL endpoint for Prisma migrations.
      - key: DIRECT_URL
        sync: false
      - key: DB_CONNECTION_LIMIT
        value: "3"
      - key: DB_POOL_TIMEOUT_SECONDS
        value: "30"
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "15"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: WHATSAPP_PROVIDER_MODE
        value: live
      - key: ENABLE_DEV_TOOLS
        value: "false"
      - key: MOCK_WHATSAPP_FORCE_FAILURE
        value: "false"
      - key: META_WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: META_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: META_WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: META_WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_API_VERSION
        value: v20.0
      - key: WHATSAPP_CREDENTIAL_KEY_ID
        value: primary
      - key: WHATSAPP_CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: WHATSAPP_CREDENTIAL_DECRYPTION_KEYS
        sync: false

databases:
  - name: bizreplyai-db
    databaseName: bizreplyai
    plan: basic-256mb
